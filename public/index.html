<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chroma Arena Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Lobby Screen -->
    <div id="lobby-screen" class="container">
        <h1>🌈 Chroma Arena Clicker</h1>
        <div class="input-group">
            <input type="text" id="playerName" placeholder="Your Name" maxlength="12">
            <input type="text" id="roomCode" placeholder="Room Code (4 chars)" maxlength="4">
        </div>
        
        <div id="host-settings" class="settings-panel">
            <h3>Host Settings</h3>
            <label>Game Minutes: <input type="number" id="game-minutes" value="5" min="1" max="60"></label>
            <label>Max Players: 
                <select id="max-players">
                    <option value="2">2 Players</option>
                    <option value="3">3 Players</option>
                    <option value="4" selected>4 Players</option>
                    <option value="5">5 Players</option>
                    <option value="6">6 Players</option>
                    <option value="7">7 Players</option>
                    <option value="8">8 Players</option>
                </select>
            </label>
        </div>

        <button id="joinBtn" class="primary-btn">Join / Create Room</button>
        <button id="startBtn" class="primary-btn" style="display: none;">Start Game</button>
        <p id="lobby-status"></p>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="container" style="display: none;">
        <aside id="left-panel">
            <h3>Rankings 🏆</h3>
            <ul id="leaderboard"></ul>
        </aside>

        <main id="game-content">
            <header>
                <div id="timer">00:00</div>
                <div id="room-info">Room: <span id="current-room"></span></div>
                <button id="leaveBtn" class="primary-btn small-btn">Leave Room</button>
            </header>

            <div id="main-game-area" class="game-view active">
                <div class="stats-bar">
                    <div id="my-score">Score: 0</div>
                    <div id="my-multiplier">x1</div>
                </div>
                <div id="click-target-container">
                    <div id="click-target" class="colorful-container">
                        <div class="target-ball"></div>
                        <div class="target-rhombus"></div>
                    </div>
                </div>
                <div class="sub-stats">
                    <span id="my-clickPower">Power: 1</span>
                    <span id="my-autoClickers">Autos: 0</span>
                    <span id="my-luckChance">Luck: 0%</span>
                </div>
            </div>
        </main>

        <aside id="right-panel">
            <h3>Upgrades 🛒</h3>
            <div id="shop-items" class="scroll-list"></div>
            <br>
            <h3>Trolls 👿</h3>
            <div id="troll-items" class="scroll-list"></div>
        </aside>
    </div>

    <div id="game-over-screen" class="container" style="display: none;">
        <h1>Game Over!</h1>
        <ul id="final-results"></ul>
        <button onclick="location.reload()" class="primary-btn">Play Again</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
