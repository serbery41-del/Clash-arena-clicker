<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chroma Arena Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Lobby Screen -->
    <div id="lobby-screen" class="container">
        <h1>🌈 Chroma Arena Clicker</h1>
        
        <!-- Mode Selection Cards -->
        <div class="mode-cards">
            <!-- Classic Mode -->
            <div class="mode-card">
                <h3>🎯 Classic</h3>
                <p>Free-for-all! Be the first to click.</p>
                <div class="input-group">
                    <input type="text" class="name-input" placeholder="Your Name" maxlength="12">
                    <input type="text" class="code-input" placeholder="Room Code" maxlength="4">
                </div>
                <div class="mode-settings">
                    <input type="number" class="time-input" value="5" min="1" max="60" title="Minutes">
                    <select class="players-input">
                        <option value="2">2 Players</option>
                        <option value="3">3 Players</option>
                        <option value="4" selected>4 Players</option>
                        <option value="5">5 Players</option>
                        <option value="6">6 Players</option>
                        <option value="7">7 Players</option>
                        <option value="8">8 Players</option>
                    </select>
                </div>
                <button class="join-classic primary-btn">Create / Join</button>
            </div>
            
            <!-- Team Battle Mode -->
            <div class="mode-card team-mode-card">
                <h3>⚔️ Team Battle</h3>
                <p>Red vs Blue! Teams are random.</p>
                <div class="input-group">
                    <input type="text" class="name-input" placeholder="Your Name" maxlength="12">
                    <input type="text" class="code-input" placeholder="Room Code" maxlength="4">
                </div>
                <div class="mode-settings">
                    <input type="number" class="time-input" value="5" min="1" max="60" title="Minutes">
                    <select class="players-input">
                        <option value="4">4 Players</option>
                        <option value="6" selected>6 Players</option>
                        <option value="8">8 Players</option>
                    </select>
                </div>
                <button class="join-team primary-btn">Create / Join</button>
            </div>

            <!-- Chaos Mode -->
            <div class="mode-card chaos-mode-card">
                <h3>🌀 Chaos Mode</h3>
                <p>Random events every 30 seconds!</p>
                <div class="input-group">
                    <input type="text" class="name-input" placeholder="Your Name" maxlength="12">
                    <input type="text" class="code-input" placeholder="Room Code" maxlength="4">
                </div>
                <div class="mode-settings">
                    <input type="number" class="time-input" value="5" min="1" max="60" title="Minutes">
                    <select class="players-input">
                        <option value="2">2 Players</option>
                        <option value="4" selected>4 Players</option>
                        <option value="8">8 Players</option>
                    </select>
                </div>
                <button class="join-chaos primary-btn">Create / Join</button>
            </div>
        </div>
        
        <p id="lobby-status"></p>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="container" style="display: none;">
        <aside id="left-panel">
            <h3>Rankings 🏆</h3>
            <ul id="leaderboard"></ul>
        </aside>

        <main id="game-content">
            <header>
                <div id="timer">00:00</div>
                <div id="room-info">Room: <span id="current-room"></span></div>
                <button id="leaveBtn" class="primary-btn small-btn">Leave Room</button>
            </header>

            <div id="main-game-area" class="game-view active">
                <div class="stats-bar">
                    <div id="my-score">Score: 0</div>
                    <div id="my-multiplier">x1</div>
                </div>
                <div id="click-target-container">
                    <div id="click-target" class="colorful-container">
                        <div class="target-ball"></div>
                        <div class="target-rhombus"></div>
                    </div>
                </div>
                <div class="sub-stats">
                    <span id="my-clickPower">Power: 1</span>
                    <span id="my-autoClickers">Autos: 0</span>
                    <span id="my-luckChance">Luck: 0%</span>
                </div>
            </div>
        </main>

        <aside id="right-panel">
            <h3>Upgrades 🛒</h3>
            <div id="shop-items" class="scroll-list"></div>
            <br>
            <h3>Trolls 👿</h3>
            <div class="target-selector">
                <label for="troll-target-select">Target:</label>
                <select id="troll-target-select">
                    <option value="random">Random Opponent</option>
                </select>
            </div>
            <div id="troll-items" class="scroll-list"></div>
        </aside>
    </div>

    <div id="game-over-screen" class="container" style="display: none;">
        <h1>Game Over!</h1>
        <ul id="final-results"></ul>
        <button onclick="location.reload()" class="primary-btn">Play Again</button>
    </div>

    <!-- Jumpscare Overlay -->
    <div id="jumpscare-overlay" class="jumpscare-overlay">
        <img id="jumpscare-img" src="" alt="SCARY!">
    </div>

    <!-- Static Overlay -->
    <div id="static-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://media.giphy.com/media/oEI9uWU9HdfZ6/giphy.gif'); background-size: cover; opacity: 0.4; z-index: 10001; pointer-events: none;"></div>

    <!-- Troll Overlay -->
    <div id="troll-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;">
        <img id="troll-image" style="max-width: 80%; max-height: 80%; border-radius: 10px;">
        <audio id="troll-sound"></audio>
    </div>

    <!-- Sound Effects -->
    <audio id="click-sound" src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2teleRYGIZ3a27BqFQMkl9jVu3EWAySQ1tS1bRYDJI7S0rFvFgMkj9HRsW4WAySO0NCwbhYDJI7Q0LBuFgMkj9DPsG4WAySP0M+wbhYDJI/Qz7BuFgMkj9DPsG4WAySP0M+wbm4=" preload="auto"></audio>
    <audio id="buy-sound" preload="auto"></audio>
    <audio id="troll-sound-effect" preload="auto"></audio>
    <audio id="lucky-sound" preload="auto"></audio>
    <audio id="gameover-sound" preload="auto"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
